# SecretSpec manifest for Kaneo — deployment side (nix-config). Declarations only.
# Values live in BWS (project: Homelab). See ashebanow/kaneo#16.
# Naming convention: env var lowercased, `kaneo-` prefix, underscores -> dashes.
# This manifest resolves the SAME BWS refs as the kaneo-repo (dev) manifest.
#
# Profile design: `default` holds only secrets shared across environments
# (SMTP). Everything environment-specific lives in `production` so a bare
# `secretspec run` never touches real credentials.
#
# sops-nix interaction (transitional): sops delivers the BWS bootstrap token
# (bws-access-token in secrets/secrets.yaml) via systemd LoadCredential;
# secretspec's systemd-credential:// provider reads it. sops-nix is
# eventually removed in favor of bws + secretspec (see nix-config migration
# ticket).

[project]
name = "kaneo"
revision = "1.0"

[providers]
bws = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52"

# Shared across all environments (SMTP only).
[profiles.default]
SMTP_FROM = { description = "SMTP From address", required = true, ref = { item = "kaneo-smtp-from" } }
SMTP_HOST = { description = "SMTP host", required = true, ref = { item = "kaneo-smtp-host" } }
SMTP_IGNORE_TLS = { description = "SMTP ignore-TLS flag", required = true, ref = { item = "kaneo-smtp-ignore-tls" } }
SMTP_PASSWORD = { description = "SMTP password (Resend API key)", required = true, ref = { item = "kaneo-smtp-password" } }
SMTP_PORT = { description = "SMTP port", required = true, ref = { item = "kaneo-smtp-port" } }
SMTP_REQUIRE_TLS = { description = "SMTP require-TLS flag", required = true, ref = { item = "kaneo-smtp-require-tls" } }
SMTP_SECURE = { description = "SMTP secure flag", required = true, ref = { item = "kaneo-smtp-secure" } }
SMTP_USER = { description = "SMTP username", required = true, ref = { item = "kaneo-smtp-user" } }

# Production environment. Inherits default's shared secrets; overrides/adds
# what differs. POSTGRES_HOST / KANEO_CLIENT_URL must be corrected to real
# prod values at deploy time — they currently hold dev-machine values.
[profiles.production]
# GitHub SSO (Sign in with GitHub) — load-bearing: only login path (DISABLE_LOGIN_FORM).
GITHUB_OAUTH_CLIENT_ID = { description = "GitHub SSO OAuth client id", required = true, ref = { item = "kaneo-github-app-client-id" } }
GITHUB_OAUTH_CLIENT_SECRET = { description = "GitHub SSO OAuth client secret", required = true, ref = { item = "kaneo-github-app-client-secret" } }
# GitHub integration (GitHub App: repo sync, webhooks).
GITHUB_APP_ID = { description = "GitHub App id", required = true, ref = { item = "kaneo-github-app-id" } }
GITHUB_WEBHOOK_SECRET = { description = "GitHub App webhook secret", required = true, ref = { item = "kaneo-github-app-webhook" } }
GITHUB_PRIVATE_KEY = { description = "GitHub App private key", required = true, ref = { item = "kaneo-github-app-private-key" } }
KANEO_CLIENT_URL = { description = "Web app URL (prod)", required = true, ref = { item = "kaneo-client-url" } }
AUTH_SECRET = { description = "Better Auth session secret (prod)", required = true, ref = { item = "kaneo-auth-secret" } }
POSTGRES_DB = { description = "PostgreSQL database name (prod)", required = true, ref = { item = "kaneo-postgres-db" } }
POSTGRES_HOST = { description = "PostgreSQL host (prod)", required = true, ref = { item = "kaneo-postgres-host" } }
POSTGRES_PASSWORD = { description = "PostgreSQL password (prod)", required = true, ref = { item = "kaneo-postgres-password" } }
POSTGRES_USER = { description = "PostgreSQL user (prod)", required = true, ref = { item = "kaneo-postgres-user" } }
