# SecretSpec manifest for Windshift — deployment side (nix-config). Declarations only.
# Values live in BWS (project: Homelab). Naming convention: env var lowercased,
# `windshift-` prefix, underscores -> dashes.
#
# Profile design: `production` holds the node-specific secrets. There is no
# shared `default` profile yet (no cross-environment secrets for windshift).
#
# Provider routing (no per-secret providers; chosen at invocation via
# SECRETSPEC_PROVIDER):
#   - service units:  SECRETSPEC_PROVIDER=bws-service   (bootstrap token from
#                      systemd credential `access_token`, sops-delivered)
#   - operator/admin: SECRETSPEC_PROVIDER=bws + BWS_ACCESS_TOKEN in the shell
#
# POSTGRES_CONNECTION_STRING is NOT a BWS item: populate-secrets.sh composes it
# from POSTGRES_USER/PASSWORD/DB (host is always windshift-db on the podman net).

[project]
name = "windshift"
revision = "1.0"

[providers]
# Read-only delivery from the current systemd service's $CREDENTIALS_DIRECTORY.
bootstrap = "systemd-credential://"
# Service route: bws provider whose access_token comes from the systemd
# credential named `access_token` (LoadCredential=access_token:<sops path>).
bws-service = {
  uri = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52",
  credentials = { access_token = "bootstrap" },
}
# Operator route: same project, token from BWS_ACCESS_TOKEN in the operator env.
bws = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52"

# Production environment.
[profiles.production]
SSO_SECRET = { description = "Windshift SSO/session secret", required = true, ref = { item = "windshift-sso-secret" } }
POSTGRES_DB = { description = "Windshift database name", required = true, ref = { item = "windshift-postgres-db" } }
POSTGRES_USER = { description = "Windshift database user", required = true, ref = { item = "windshift-postgres-user" } }
POSTGRES_PASSWORD = { description = "Windshift database password", required = true, ref = { item = "windshift-postgres-password" } }
TS_AUTHKEY = { description = "Tailscale auth key for the windshift sidecar (not an API key)", required = true, ref = { item = "windshift-tailscale-auth-key" } }
BASE_URL = { description = "Web app URL (prod)", required = true, ref = { item = "windshift-base-url" } }
ALLOWED_HOSTS = { description = "Allowed Host header(s) (prod)", required = true, ref = { item = "windshift-allowed-hosts" } }
