# Bifrost LLM gateway with Tailscale sidecar.
# After `podman-compose up -d`, bifrost is available at:
#   https://ai.fluffy-walleye.ts.net
#
# The gateway shares the sidecar's network namespace and binds 127.0.0.1 only,
# so nothing is published on the host and nothing is reachable on the tailnet
# except through `tailscale serve` (which proxies from localhost). The hostname
# is `ai` (function, not brand) so a future gateway swap does not move the
# endpoint.
#
# Bifrost is Go, not Python: this replaces LiteLLM specifically to escape the
# streaming-body truncation that forced clients to disable streaming.
#
# config.json is mounted read-only from the Nix store (via /etc/bifrost).
# Bifrost never writes it; `source_of_truth: "config.json"` means the file wins
# over the config DB on every restart, so the UI stays browsable without
# becoming the source of truth. Request logs live in the named volume and
# survive rebuilds.
#
# The sidecar also joins `llm-internal` (an external host-local bridge created
# by podman-network-llm-internal.service). bifrost-app inherits it via the
# shared netns and reaches llama-server at `qwen-35b-a3b:8080` on that bridge —
# not over the tailnet, whose same-host hop is DERP-relayed and truncates large
# request bodies (BOX-140).

services:
  tailscale:
    image: docker.io/tailscale/tailscale:v1.98.4
    container_name: bifrost-ts
    hostname: ai
    networks:
      - default
      - llm-internal
    environment:
      - TS_AUTHKEY=${BIFROST_TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    command: |
      sh -c "
      tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state &
      sleep 2
      # --accept-dns=false: keep podman's own resolver (aardvark) so bifrost can
      # resolve `qwen-35b-a3b` on the llm-internal bridge. MagicDNS would
      # overwrite resolv.conf and this stack has no .ts.net upstreams to lose.
      tailscale up --auth-key=${BIFROST_TS_AUTHKEY} --hostname=ai --accept-dns=false || {
        echo 'ERROR: tailscale up failed (check BIFROST_TS_AUTHKEY)' >&2
        exit 1
      }
      sleep 2
      tailscale serve reset 2>/dev/null || true
      tailscale serve --bg http://localhost:8080
      wait
      "

  bifrost:
    image: docker.io/maximhq/bifrost:v2.0.0
    container_name: bifrost-app
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      # Loopback only: tailscale serve (same netns) proxies from localhost, so
      # binding 0.0.0.0 would also expose the raw port on the tailnet.
      - APP_HOST=127.0.0.1
      - APP_PORT=8080
      - LOG_LEVEL=info
      - LOG_STYLE=json
      # Remote-provider keys — resolved from the bifrost secret scope by
      # secretspec and substituted here by podman-compose. config.json
      # references them by name (`env.<VAR>`); no value is written to the config.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - bifrost-data:/app/data
      - /etc/bifrost/config.json:/app/data/config.json:ro
    restart: unless-stopped

networks:
  default:
  llm-internal:
    external: true

volumes:
  ts-state:
  bifrost-data:
