# LiteLLM proxy with Tailscale sidecar.
# After `podman-compose up -d`, LiteLLM is available at:
#   https://litellm.fluffy-walleye.ts.net
#
# TLS is handled by tailscale serve (temporary — will switch to tailscale cert).
# LiteLLM routes requests to model backends by model name in the request body.

services:
  tailscale:
    image: docker.io/tailscale/tailscale:latest
    container_name: litellm-ts
    hostname: litellm
    environment:
      - TS_AUTHKEY=$$TS_AUTHKEY
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=litellm
      - TS_ACCEPT_DNS=true
    volumes:
      - ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    command: >
      sh -c '
        tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state &
        sleep 2
        tailscale up --auth-key=$$TS_AUTHKEY --hostname=litellm --accept-dns
        tailscale serve --bg http://localhost:4000
        wait
      '

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-app
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - /etc/litellm/litellm-config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"

volumes:
  ts-state:
