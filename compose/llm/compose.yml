# LiteLLM proxy with Tailscale sidecar.
# After `podman-compose up -d`, LiteLLM is available at:
#   https://litellm.fluffy-walleye.ts.net
#
# TLS is handled by tailscale serve (temporary — will switch to tailscale cert).
# LiteLLM routes requests to model backends by model name in the request body.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: litellm-db
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  tailscale:
    image: docker.io/tailscale/tailscale:latest
    container_name: litellm-ts
    hostname: litellm
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    command: |
      sh -c "
      tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state &
      sleep 2
      tailscale up --auth-key=${TS_AUTHKEY} --hostname=litellm --accept-dns || {
        echo 'ERROR: tailscale up failed (check TS_AUTHKEY)' >&2
        exit 1
      }
      sleep 2
      tailscale serve reset 2>/dev/null || true
      tailscale serve --bg http://localhost:4000
      wait
      "

  litellm:
    image: ghcr.io/berriai/litellm:v1.97.0
    container_name: litellm-app
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
    volumes:
      - /etc/litellm/litellm-config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"

volumes:
  ts-state:
  pg-data:
