# Open WebUI with Tailscale sidecar.
# After `podman-compose up -d`, the UI is available at:
#   https://openwebui.fluffy-walleye.ts.net
#
# Connects to the bifrost gateway at https://ai.fluffy-walleye.ts.net/v1 for
# all models (local qwen + deepseek/anthropic/gemini). OPENAI_API_KEY carries
# this client's virtual key (`openwebui`), so the gateway records
# `virtual_key_name: openwebui` and its traffic is filterable by client
# (BOX-199, parent BOX-149). It is an attribution label, not authorization:
# the gateway does not require it (BOX-193 owns enforcement). openwebui-ts
# reaches the `ai` node directly (container↔container hole-punches on-host), so
# large streaming prompts are unaffected by the DERP issue that hits
# container→host (BOX-140).
#
# WEBUI_SECRET_KEY is the session-signing key. It resolves to the same BWS
# value the LiteLLM master key used, now under an honest name in the openwebui
# scope (BOX-138 part 1) — the value is unchanged, so existing sessions stay
# valid.

services:
  tailscale:
    image: docker.io/tailscale/tailscale:latest
    container_name: openwebui-ts
    hostname: openwebui
    # MagicDNS does not resolve inside this shared network namespace, so pin the
    # gateway node's tailnet address here.
    #
    # `tailscale up --accept-dns` is set below and `tailscale dns status`
    # reports MagicDNS enabled, but /etc/resolv.conf keeps pointing at podman's
    # aardvark resolver (10.89.x.1), which knows nothing about .ts.net names.
    # Nothing rewrites that file -- the image has no resolvconf and tailscaled
    # will not manage it -- and Tailscale's own 100.100.100.100 returns
    # SERVFAIL from this namespace. So ai.fluffy-walleye.ts.net is NXDOMAIN and
    # every Open WebUI chat fails with "Server Connection Error", for local and
    # remote models alike, since both go through the gateway.
    #
    # This stack is the only one that must resolve a DIFFERENT tailnet node:
    # bifrost runs ON `ai` and never looks its own hostname up, and the memory
    # stack's client never calls another .ts.net name. That is why the gap went
    # unnoticed until Open WebUI was actually used.
    #
    # On THIS service, not on open-webui. podman rejects extra_hosts on a
    # container that joins another's network namespace ("cannot set extra host
    # entries when the container is joined to another containers network
    # namespace"), which fails the unit with status 125. Declared by the
    # namespace owner, the entry lands in the shared /etc/hosts and the joined
    # container sees it -- verified.
    #
    # tailnet IPs are assigned once per node and persist across restarts, so
    # this is not address churn. If `ai` is ever re-keyed, update this line; the
    # failure is a hard connection error, not a silent one.
    extra_hosts:
      - "ai.fluffy-walleye.ts.net:100.106.204.40"
    environment:
      - TS_AUTHKEY=${OPENWEBUI_TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    command: |
      sh -c "
      tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state &
      sleep 2
      tailscale up --auth-key=${OPENWEBUI_TS_AUTHKEY} --hostname=openwebui --accept-dns || {
        echo 'ERROR: tailscale up failed (check OPENWEBUI_TS_AUTHKEY)' >&2
        exit 1
      }
      sleep 2
      tailscale serve reset 2>/dev/null || true
      tailscale serve --bg http://localhost:8080
      wait
      "

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui-app
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - OPENAI_API_BASE_URL=https://ai.fluffy-walleye.ts.net/v1
      - OPENAI_API_KEY=${VK_OPENWEBUI}
      # Curated model list for connection 0. bifrost's /v1/models enumerates only
      # its native providers, never the local qwen custom provider, so model_ids
      # names every model explicitly; the remote entries match what
      # bifrost-config.json actually serves (no minimax — BOX-156 dropped it).
      #
      # These vars seed a FRESH database only: Open WebUI persists connections in
      # its `config` table (ENABLE_PERSISTENT_CONFIG=true), so an existing install
      # keeps whatever the UI saved. Changing this list for a live instance means
      # editing the connection in the UI or clearing the `openai.*` config rows.
      - 'OPENAI_API_CONFIGS={"0":{"enable":true,"prefix_id":"","tags":[],"model_ids":["qwen-latest","deepseek/deepseek-v4-pro","deepseek/deepseek-v4-flash","anthropic/claude-haiku-4-5-20251001","anthropic/claude-sonnet-5","anthropic/claude-opus-5","anthropic/claude-fable-5-1","gemini/gemini-3.7-flash","gemini/gemini-3.6-flash","gemini/gemini-3.5-flash","gemini/gemini-3.5-flash-lite"]}}'
      # Session-signing key — same BWS value as before, honest name. See header.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  ts-state:
  webui-data:
