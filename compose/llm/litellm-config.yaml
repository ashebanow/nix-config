# LiteLLM proxy configuration
# Routes model names to backend API endpoints.
# LiteLLM reaches the llama.cpp containers via the podman host gateway.

model_list:
  # Local models on llama.cpp
  - model_name: qwen-35b-a3b
    litellm_params:
      model: openai/qwen-35b-a3b
      api_base: http://host.containers.internal:8080/v1
      api_key: sk-dummy
      rpm: 100
      timeout: 600

  - model_name: gemma-27b
    litellm_params:
      model: openai/gemma-27b
      api_base: http://host.containers.internal:8081/v1
      api_key: sk-dummy
      rpm: 100
      timeout: 600

  # Remote models (API keys from environment)
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
