# LiteLLM proxy configuration
# Routes model names to backend API endpoints.
# LiteLLM reaches the llama.cpp containers via the host's Tailscale IP.
# host.containers.internal does not forward pasta-mapped ports to bridge
# networks in rootless podman. The Tailscale IP (100.x) is a stable CGNAT
# address assigned by the coordination server, not DHCP.
#
# ⚠ Streaming bug: the proxy's streaming handler truncates request bodies
#   at ~12 KB, causing 400 errors on large prompts. Non-streaming works
#   fine up to 60 KB+. Workaround: configure AI clients (pi, etc.) to
#   use non-streaming for local models. Open WebUI has a toggle in
#   Settings → Advanced → "Stream Chat Response". For pi, configure
#   the litellm provider to use `stream: false`.
#   Track: https://github.com/BerriAI/litellm/issues (search: streaming body truncation)

model_list:
  # Local models on llama.cpp (both routes point at the same llama-server at
  # 100.90.247.10:8080 — llama.cpp ignores the model field, so the name is
  # purely a client-facing alias).
  #   qwen-35b-a3b — legacy route, kept for back compat
  #   qwen-latest  — generic alias for whatever model is currently deployed
  - model_name: qwen-35b-a3b
    litellm_params:
      model: openai/qwen-35b-a3b
      api_base: http://100.90.247.10:8080/v1
      api_key: sk-dummy
      rpm: 100
      timeout: 600
      stream_timeout: 600
      context_window: 262144
      max_input_tokens: 262144

  - model_name: qwen-latest
    litellm_params:
      model: openai/qwen-latest
      api_base: http://100.90.247.10:8080/v1
      api_key: sk-dummy
      rpm: 100
      timeout: 600
      stream_timeout: 600
      context_window: 262144
      max_input_tokens: 262144

  # Remote models — OpenAI-compatible providers with custom api_base
  # Using openai/* provider bypasses LiteLLM's outdated built-in mappings.
  # The model field must include the matched prefix so the upstream
  # receives the full model ID (e.g. deepseek-v4-flash, not just v4-flash).
  - model_name: deepseek-*
    litellm_params:
      model: openai/deepseek-*
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: minimax-*
    litellm_params:
      model: openai/minimax-*
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  # Anthropic uses LiteLLM's native provider (model IDs are current)
  - model_name: claude-*
    litellm_params:
      model: anthropic/*
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: true
  max_tokens: 32768
