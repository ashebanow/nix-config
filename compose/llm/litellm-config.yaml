# LiteLLM proxy configuration
# Routes model names to backend API endpoints.
# LiteLLM reaches the llama.cpp containers via the podman host gateway.

model_list:
  # Local models on llama.cpp
  - model_name: qwen-35b-a3b
    litellm_params:
      model: openai/qwen-35b-a3b
      api_base: http://host.containers.internal:8080/v1
      api_key: sk-dummy
      rpm: 100
      timeout: 600

  # Remote models — OpenAI-compatible providers with custom api_base
  # Using openai/* provider bypasses LiteLLM's outdated built-in mappings.
  # The model field must include the matched prefix so the upstream
  # receives the full model ID (e.g. deepseek-v4-flash, not just v4-flash).
  - model_name: deepseek-*
    litellm_params:
      model: openai/deepseek-*
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: minimax-*
    litellm_params:
      model: openai/minimax-*
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  # Anthropic uses LiteLLM's native provider (model IDs are current)
  - model_name: claude-*
    litellm_params:
      model: anthropic/*
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
