# SecretSpec manifest for nix-config — declarations only, never values.
# Values live in BWS (project: Homelab). Naming convention: env var lowercased,
# service prefix, underscores -> dashes (e.g. litellm-tailscale-auth-key).
#
# Single shared manifest at the repo root. Every consumer resolves only its own
# scope (SECRETSPEC_SCOPE / -S), so a service never receives secrets it does
# not need. See SECRET_SYNC.md for the full architecture.
#
# Provider routing (no per-secret providers; chosen at invocation via
# SECRETSPEC_PROVIDER):
#   - systemd service units: SECRETSPEC_PROVIDER=bws-service
#       (access_token credential delivered via LoadCredential from
#        /var/lib/secrets/bws-access-token, read through the
#        systemd-credential:// bootstrap provider)
#   - operator / dev shell:  SECRETSPEC_PROVIDER=bws + BWS_ACCESS_TOKEN in env
#
# secretspec never declares sops or age as a provider. The BWS bootstrap token
# itself is provisioned out-of-band (see SECRET_SYNC.md); nothing in this file
# or anywhere in git holds a secret value.

[project]
name = "nix-config"
revision = "1.0"

[providers]
# Read-only delivery from the current systemd service's $CREDENTIALS_DIRECTORY.
bootstrap = "systemd-credential://"
# Service route: bws provider whose access_token comes from the systemd
# credential named `access_token` (LoadCredential=access_token:<bootstrap file>).
bws-service = {
  uri = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52",
  credentials = { access_token = "bootstrap" },
}
# Operator route: same project, token from BWS_ACCESS_TOKEN in the operator env.
bws = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52"

# Production environment — the only environment this repo deploys.
[profiles.production]
# --- host scope (root system services) ---
TAILSCALE_AUTH_KEY = { description = "Tailscale auth key for the lumquat node", required = true, ref = { item = "lumquat-tailscale-auth-key" } }
FLAKEHUB_TOKEN = { description = "FlakeHub token for determinate-nixd cache auth", required = true, ref = { item = "NIX_FLAKEHUB_CACHE_TOKEN" } }

# --- litellm scope ---
TS_AUTHKEY = { description = "Tailscale auth key for the litellm sidecar", required = true, ref = { item = "litellm-tailscale-auth-key" } }
LITELLM_MASTER_KEY = { description = "LiteLLM master key", required = true, ref = { item = "LiteLLM Master Key" } }
LITELLM_DB_PASSWORD = { description = "LiteLLM postgres password", required = true, ref = { item = "litellm-db-password" } }
DEEPSEEK_API_KEY = { description = "DeepSeek API key", required = true, ref = { item = "deepseek-api-key" } }
ANTHROPIC_API_KEY = { description = "Anthropic API key", required = true, ref = { item = "anthropic-api-key-pi" } }
MINIMAX_API_KEY = { description = "MiniMax API key", required = true, ref = { item = "minimax-api-key" } }

# --- openwebui scope ---
OPENWEBUI_TS_AUTHKEY = { description = "Tailscale auth key for the openwebui sidecar", required = true, ref = { item = "OpenWebUI TS Auth Key" } }

# --- memory scope (mnemosyne) ---
MEMORY_TS_AUTHKEY = { description = "Tailscale auth key for the mnemosyne sidecar", required = true, ref = { item = "mnemo-tailscale-auth-key" } }
MNEMOSYNE_MCP_TOKEN = { description = "Mnemosyne MCP auth token", required = true, ref = { item = "mnemosyne-mcp-token" } }

# Scopes — membership-only subsets of the production profile. Each consumer
# resolves only its own scope (least privilege).
[scopes.host]
secrets = ["TAILSCALE_AUTH_KEY", "FLAKEHUB_TOKEN"]

[scopes.litellm]
secrets = [
  "TS_AUTHKEY",
  "LITELLM_MASTER_KEY",
  "LITELLM_DB_PASSWORD",
  "DEEPSEEK_API_KEY",
  "ANTHROPIC_API_KEY",
  "MINIMAX_API_KEY",
]

[scopes.openwebui]
secrets = ["OPENWEBUI_TS_AUTHKEY", "LITELLM_MASTER_KEY"]

[scopes.memory]
secrets = ["MEMORY_TS_AUTHKEY", "MNEMOSYNE_MCP_TOKEN"]
