# SecretSpec manifest for nix-config — declarations only, never values.
# Values live in BWS (project: Homelab). Naming convention: env var lowercased,
# service prefix, underscores -> dashes (e.g. bifrost-tailscale-auth-key).
#
# Single shared manifest at the repo root. Every consumer resolves only its own
# scope (SECRETSPEC_SCOPE / -S), so a service never receives secrets it does
# not need. See SECRET_SYNC.md for the full architecture.
#
# Profiles are environments. `default` (and its explicit alias `development`)
# is development-safe and carries no production values, so a bare `secretspec`
# invocation on a developer machine cannot resolve one by accident. Everything
# real lives in `production`, which every host and every container stack
# selects explicitly with `-P production`.
#
# Provider routing (no per-secret providers; chosen at invocation via
# SECRETSPEC_PROVIDER):
#   - systemd service units: SECRETSPEC_PROVIDER=bws-service
#       (access_token credential delivered via LoadCredential from
#        /var/lib/secrets/bws-access-token, read through the
#        systemd-credential:// bootstrap provider)
#   - operator / dev shell:  SECRETSPEC_PROVIDER=bws + BWS_ACCESS_TOKEN in env
#
# secretspec never declares sops or age as a provider. The BWS bootstrap token
# itself is provisioned out-of-band (see SECRET_SYNC.md); nothing in this file
# or anywhere in git holds a secret value.

[project]
name = "nix-config"
revision = "1.0"

[providers]
# Read-only delivery from the current systemd service's $CREDENTIALS_DIRECTORY.
bootstrap = "systemd-credential://"
# Service route: bws provider whose access_token comes from the systemd
# credential named `access_token` (LoadCredential=access_token:<bootstrap file>).
bws-service = {
  uri = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52",
  credentials = { access_token = "bootstrap" },
}
# Operator route: same project, token from BWS_ACCESS_TOKEN in the operator env.
bws = "bws://vault.bitwarden.com@c0473754-981b-4e40-bc87-b2700012ef52"

# --- development profile (the fallback) ---
# Development-safe: it carries no production values, so a bare `secretspec`
# invocation on a developer machine cannot resolve one. secretspec requires
# every profile to declare at least one secret, so this inert marker satisfies
# that; nothing reads it. Development-only values, when they exist, go here.
[profiles.default]
DEVELOPMENT_PROFILE = { description = "Development profile marker — carries no credential and is never read", required = false, default = "development" }

# --- production profile ---
# The real secret set. Every NixOS host and container stack resolves this
# profile. `inherit = false` makes production standalone so the development
# marker does not leak into it; every production secret is declared below.
#
# There is no per-host profile: secretspec profiles cannot inherit from one
# another (only `default` -> non-default), and host services need the whole
# production set plus their own node key, which is selected by scope instead.
[profiles.production.defaults]
inherit = false

[profiles.production]

# --- host scope (root system services) ---
# A Tailscale auth key is issued per node, so each NixOS host has its own
# declaration here. The node key is selected by the host's scope
# ([scopes.host-<host>]); modules/features/secrets.nix derives the variable
# name from my.hostName.
LUMQUAT_TAILSCALE_AUTH_KEY = { description = "Tailscale auth key for the lumquat node", required = true, ref = { item = "lumquat-tailscale-auth-key" } }
YUZU_TAILSCALE_AUTH_KEY = { description = "Tailscale auth key for the yuzu node", required = true, ref = { item = "yuzu-tailscale-auth-key" } }
FLAKEHUB_TOKEN = { description = "FlakeHub token for determinate-nixd cache auth", required = true, ref = { item = "NIX_FLAKEHUB_CACHE_TOKEN" } }
CACHIX_AUTH_TOKEN = { description = "Cachix auth token", required = true, ref = { item = "CACHIX_AUTH_TOKEN" } }

# Remote LLM provider API keys — consumed by the bifrost gateway.
DEEPSEEK_API_KEY = { description = "DeepSeek API key", required = false, ref = { item = "deepseek-api-key" } }
ANTHROPIC_API_KEY = { description = "Anthropic API key", required = false, ref = { item = "anthropic-api-key-pi" } }
MINIMAX_API_KEY = { description = "MiniMax API key", required = false, ref = { item = "minimax-api-key" } }
GEMINI_API_KEY = { description = "Google Gemini API key", required = false, ref = { item = "gemini-api-key" } }

# --- bifrost scope (the LLM gateway) ---
# Reusable auth key, so the sidecar re-authenticates cleanly whenever the
# container is recreated. The `ai` node has key expiry disabled in the admin
# console (a manual step nothing in git records).
BIFROST_TS_AUTHKEY = { description = "Tailscale auth key for the bifrost sidecar (reusable)", required = true, ref = { item = "bifrost-tailscale-auth-key" } }

# Per-client virtual keys (BOX-149). One per client tool, so the gateway's log
# view can attribute a request to the client that sent it. Values are randomly
# generated (`sk-bf-` + 32 hex) and stored in BWS; config.json references them
# as `env.VK_*`, so no value is ever written to git. These are *attribution*
# labels, not authorization: `enforce_auth_on_inference` stays false (BOX-193
# flips it), so a request without one is recorded as anonymous, not rejected.
VK_PI = { description = "Virtual key: pi", required = true, ref = { item = "bifrost-vk-pi" } }
VK_HERMES = { description = "Virtual key: hermes", required = true, ref = { item = "bifrost-vk-hermes" } }
VK_ZED = { description = "Virtual key: Zed", required = true, ref = { item = "bifrost-vk-zed" } }
VK_RAYCAST = { description = "Virtual key: Raycast", required = true, ref = { item = "bifrost-vk-raycast" } }
VK_OPENWEBUI = { description = "Virtual key: Open WebUI", required = true, ref = { item = "bifrost-vk-openwebui" } }
VK_GATE = { description = "Virtual key: reliability gate", required = true, ref = { item = "bifrost-vk-gate" } }

# --- openwebui scope ---
OPENWEBUI_TS_AUTHKEY = { description = "Tailscale auth key for the openwebui sidecar", required = true, ref = { item = "OpenWebUI TS Auth Key" } }
# Session-signing key. Same value the LiteLLM master key held, moved to a BWS
# item of its own (`webui-secret-key`) so nothing openwebui depends on carries a
# litellm name. Existing sessions stay valid — the value is unchanged.
WEBUI_SECRET_KEY = { description = "Open WebUI session-signing key", required = true, ref = { item = "webui-secret-key" } }

# --- dev scope (operator tools on the host) ---
# The Linear CLI (linear-cli, lib/overlays/linear-cli.nix) replaces the Linear
# MCP for the agents (BOX-176). Its key is a production secret in CONTEXT.md's
# sense (in BWS; bills ashebanow's account, does not reach him as a person),
# and on lumquat the operator's shell has no BWS token of its own, so
# host-secrets-populate materializes it at /run/secrets/linear-api-key
# (tmpfs, 0400, owned by the operator user) and the `linear` wrapper reads it.
# See docs/adr/0001. The BWS item keeps its historical `-mcp-` name.
LINEAR_API_KEY = { description = "Linear API key for the linear CLI (operator/dev tool; BWS item keeps its historical -mcp- name)", required = false, ref = { item = "linear-mcp-api-key" } }

# --- resilio scope (Resilio Sync, NixOS desktops) ---
# The read/write key for the "Synced Files" folder, shared by every desktop that
# syncs it. Copied into BWS from the Bitwarden Password Manager login "Resilio
# Sync" (text field "r/w key for Synced Files"), which is where the macs still
# read it from by hand. Deliberately NOT in a host scope: the key belongs to the
# folder, not to one node, so a second NixOS desktop joins the same folder by
# pulling this scope rather than getting a declaration of its own. The daemon
# reads it from a root-only file at activation (see modules/features/resilio.nix),
# never from the Nix store.
RESILIO_SYNCED_FILES_TOKEN = { description = "Resilio Sync read/write key for the Synced Files folder", required = true, ref = { item = "resilio-synced-files-token" } }
# The owner license (.btskey). Account-specific rather than folder-specific, and
# it contains the licensee's name, so it belongs here with the other production
# secrets rather than anywhere in the store.
#
# Without it a shared folder is added in the "stopped" state and the daemon
# never attempts a peer connection at all -- it opens its listen sockets, scans
# the tree, and then sits there looking healthy. That failure is indistinguishable
# from a network or firewall problem, which is why it went undiagnosed for so
# long; see docs/research/resilio-sync-nixos.md. It is applied with the rslsync
# `--license` flag because the Web UI's licensing page cannot actually install
# the file (its picker cannot navigate the filesystem), and because the flag is
# reproducible from a module while a GUI click is not.
RESILIO_LICENSE_KEY = { description = "Resilio Sync owner license (.btskey)", required = true, ref = { item = "resilio-license-key" } }

# --- memory scope (mnemosyne) ---
MEMORY_TS_AUTHKEY = { description = "Tailscale auth key for the mnemosyne sidecar", required = true, ref = { item = "mnemo-tailscale-auth-key" } }
MNEMOSYNE_MCP_TOKEN = { description = "Mnemosyne MCP auth token", required = true, ref = { item = "mnemosyne-mcp-token" } }

# Explicit name for the development environment; inherits the (empty) default.
[profiles.development]

# Scopes — membership-only subsets of the selected profile. Each consumer
# resolves only its own scope (least privilege). Scopes are orthogonal to
# profiles: they select which secrets a consumer sees, not which environment.
#
# The host scope is per node because the node's Tailscale auth key is the one
# secret that genuinely differs between hosts. Add a [scopes.host-<host>] pair
# alongside the host's <HOST>_TAILSCALE_AUTH_KEY declaration.
[scopes.host-lumquat]
secrets = ["LUMQUAT_TAILSCALE_AUTH_KEY", "FLAKEHUB_TOKEN", "CACHIX_AUTH_TOKEN"]

[scopes.host-yuzu]
secrets = ["YUZU_TAILSCALE_AUTH_KEY", "FLAKEHUB_TOKEN", "CACHIX_AUTH_TOKEN"]

# Operator-tool secrets: resolved by host-secrets-populate like the host scope,
# but written user-readable for the operator account rather than root-only — a
# different trust class, hence a different scope. Anything an interactive tool
# on the headless host needs goes here, never into a host scope.
[scopes.dev]
secrets = ["LINEAR_API_KEY"]

[scopes.openwebui]
# VK_OPENWEBUI is the per-client attribution key (BOX-199, parent BOX-149);
# the gateway records it as `virtual_key_name` on every log row. It rides
# OPENAI_API_KEY in the compose env, which Open WebUI sends as Authorization.
secrets = ["OPENWEBUI_TS_AUTHKEY", "WEBUI_SECRET_KEY", "VK_OPENWEBUI"]

[scopes.memory]
secrets = ["MEMORY_TS_AUTHKEY", "MNEMOSYNE_MCP_TOKEN"]

[scopes.resilio]
secrets = ["RESILIO_SYNCED_FILES_TOKEN", "RESILIO_LICENSE_KEY"]

[scopes.bifrost]
secrets = [
  "BIFROST_TS_AUTHKEY",
  "DEEPSEEK_API_KEY",
  "ANTHROPIC_API_KEY",
  "GEMINI_API_KEY",
  "VK_PI",
  "VK_HERMES",
  "VK_ZED",
  "VK_RAYCAST",
  "VK_OPENWEBUI",
  "VK_GATE",
]
